# nginx for the LOWKEY web build (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify's proxy terminates HTTPS; these apply to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container health check (Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # JS bundles have a content hash in their name: cache them for a year.
    location /_expo/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Images and sounds (also hashed by Expo).
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # nginx doesn't know .wav by default; the game's sound effects need it.
    location ~* \.wav$ {
        types { }
        default_type audio/wav;
        expires 30d;
        try_files $uri =404;
    }

    # The page itself is never cached, so a new deploy shows up straight away.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
